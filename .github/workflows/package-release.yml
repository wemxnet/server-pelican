name: Package release

on:
  release:
    types: [published]

jobs:
  package:
    name: Attach Pelican.zip
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Package files into a Pelican folder
        run: |
          mkdir -p build/Pelican
          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="build" \
            --exclude=".DS_Store" \
            ./ build/Pelican/
          (
            cd build
            zip -r Pelican.zip Pelican
          )
          unzip -l build/Pelican.zip

      - name: Upload zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Pelican.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
